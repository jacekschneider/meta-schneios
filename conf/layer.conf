# We have a conf and classes directory, add to BBPATH
BBPATH .= ":${LAYERDIR}"

# We have recipes-* directories, add to BBFILES
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb"
BBFILES += "${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "meta-schneios"
BBFILE_PATTERN_meta-schneios = "^${LAYERDIR}/"
BBFILE_PRIORITY_meta-schneios = "6"

LAYERDEPENDS_meta-schneios = "core"
LAYERSERIES_COMPAT_meta-schneios = "wrynose"

include schneios.conf