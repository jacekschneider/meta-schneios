require conf/machine/zynq-generic.conf

PREFERRED_PROVIDER_virtual/dtb = "device-tree"
KERNEL_IMAGETYPE = "zImage"

# embedded software configuration
BITSTREAM_PATH = "${TOPDIR}/../embeddedsw/zynqberry-schneios.bit"
FSBL_FILE = "${TOPDIR}/../embeddedsw/fsbl"
SYSTEM_DTFILE = "system.dts"

# The uboot cmd file is chosen by BOOTMODE
# We use internal generic schneios command
BOOTMODE = "generic.schneios"